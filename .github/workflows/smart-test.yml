name: Smart Test Suite

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      commit-type: ${{ steps.analyze-commit.outputs.type }}
      js-changed: ${{ steps.filter.outputs.js }}
      python-changed: ${{ steps.filter.outputs.python }}
      test-category: ${{ steps.analyze-commit.outputs.test-category }}
    steps:
      - name: Harden the runner (Block egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org
            api.github.com
            github.com
            objects.githubusercontent.com
            nodejs.org
            raw.githubusercontent.com
            pypi.org
            files.pythonhosted.org

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # On PR runs HEAD is the synthetic merge-ref commit; analyze the PR head commit instead.
          # Empty on push -> defaults to the triggering ref (safe).
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            js:
              - 'src/**/*.{js,jsx}'
              - 'package.json'
              - 'package-lock.json'
              - '**/*.{test,spec}.{js,jsx}'
            python:
              - 'scripts/**/*.py'
              - 'scripts/requirements.txt'
              - '**/*.{test,spec}.py'

      - name: Analyze commit message
        id: analyze-commit
        env:
          # Passed via env, never interpolated into the script body, so PR
          # titles cannot inject shell code.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Classify PR runs by the PR title (the checkout is the PR head
          # commit, whose message may be a trivial 'chore' that does not
          # represent the PR); push runs use the actual commit message.
          if [ -n "$PR_TITLE" ]; then
            commit_msg="$PR_TITLE"
          else
            commit_msg=$(git log -1 --pretty=%B HEAD)
          fi

          # Validate that commit_msg is not empty
          if [ -z "$commit_msg" ]; then
            echo "type=other" >> $GITHUB_OUTPUT
            echo "test-category=standard" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Determine commit type using patterns
          # Using printf and case statement instead of echo/grep for safer handling
          commit_type="other"
          test_category="standard"

          case "$commit_msg" in
            "Update challenge:"*)
              commit_type="daily"
              test_category="game-logic"
              ;;
            "Update dependency"*)
              # Renovate squash commits: 'Update dependency X to Y (#N)' (95 of them)
              commit_type="dependency"
              test_category="linting-build"
              ;;
            "chore(deps):"*)
              commit_type="dependency"
              test_category="linting-build"
              ;;
            "fix:"*)
              commit_type="fix"
              test_category="affected"
              ;;
            "feat:"*)
              commit_type="feature"
              test_category="full"
              ;;
            "chore:"*)
              commit_type="chore"
              test_category="minimal"
              ;;
            "Merge "*)
              # Merge commits / PR titles like 'Merge pull request #N ...' — build-test covers them
              commit_type="other"
              test_category="standard"
              ;;
          esac

          echo "type=$commit_type" >> $GITHUB_OUTPUT
          echo "test-category=$test_category" >> $GITHUB_OUTPUT

          echo "Commit type: $commit_type"
          echo "Test category: $test_category"

  lint:
    name: Linting
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.js-changed == 'true' || needs.detect-changes.outputs.python-changed == 'true'
    steps:
      - name: Harden the runner (Block egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org
            api.github.com
            github.com
            objects.githubusercontent.com
            nodejs.org
            raw.githubusercontent.com
            pypi.org
            files.pythonhosted.org

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: needs.detect-changes.outputs.js-changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: needs.detect-changes.outputs.js-changed == 'true'
        run: npm ci

      - name: Run ESLint
        if: needs.detect-changes.outputs.js-changed == 'true'
        run: npm run lint

      - name: Setup Python
        if: needs.detect-changes.outputs.python-changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Python dependencies
        if: needs.detect-changes.outputs.python-changed == 'true'
        run: |
          pip install pylint
          pip install -r scripts/requirements.txt

      - name: Run Pylint
        if: needs.detect-changes.outputs.python-changed == 'true'
        run: pylint scripts/*.py --errors-only

  dependency-tests:
    name: Dependency Resolution
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.commit-type == 'dependency'
    steps:
      - name: Harden the runner (Block egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org
            api.github.com
            github.com
            objects.githubusercontent.com
            nodejs.org
            raw.githubusercontent.com
            pypi.org
            files.pythonhosted.org

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Verify npm dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7

      - name: Verify Python dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip check

  js-unit-tests:
    name: JS Unit Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.js-changed == 'true'
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Harden the runner (Block egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org
            api.github.com
            github.com
            objects.githubusercontent.com
            nodejs.org
            raw.githubusercontent.com
            pypi.org
            files.pythonhosted.org

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (shard ${{ matrix.shard }})
        run: npx vitest run --config=vitest.config.js --shard=${{ matrix.shard }}/3 tests/unit

  python-unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.python-changed == 'true'
    steps:
      - name: Harden the runner (Block egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org
            api.github.com
            github.com
            objects.githubusercontent.com
            nodejs.org
            raw.githubusercontent.com
            pypi.org
            files.pythonhosted.org

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov python-dotenv requests

      - name: Run unit tests
        run: pytest tests/ -v --no-cov

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.commit-type == 'daily' ||
      needs.detect-changes.outputs.commit-type == 'fix' ||
      needs.detect-changes.outputs.commit-type == 'feature' ||
      needs.detect-changes.outputs.test-category == 'full'
    steps:
      - name: Harden the runner (Block egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org
            api.github.com
            github.com
            objects.githubusercontent.com
            nodejs.org
            raw.githubusercontent.com
            pypi.org
            files.pythonhosted.org

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run JS integration tests
        run: npx vitest run --config=vitest.config.js tests/integration

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install pytest pytest-cov

      - name: Run Python integration tests
        run: pytest tests/integration/test_data_pipeline_integration.py -v --no-cov

  game-logic-tests:
    name: Game Logic Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.commit-type == 'daily'
    steps:
      - name: Harden the runner (Block egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org
            api.github.com
            github.com
            objects.githubusercontent.com
            nodejs.org
            raw.githubusercontent.com
            pypi.org
            files.pythonhosted.org

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run GameLogic tests
        run: npx vitest run --config=vitest.config.js tests/unit/utils/GameLogic.test.jsx

      - name: Run DailyBirdUtils tests
        run: npx vitest run --config=vitest.config.js tests/unit/utils/DailyBirdUtils.test.jsx

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7

      - name: Run Python daily generation tests
        run: |
          pip install pytest python-dotenv
          pytest tests/test_generate_daily_birds.py -v --no-cov

  build-test:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: detect-changes
    # Gate: linting-build (dependency commits), full (features), affected (fixes —
    # integration-tests already runs for fix:, this adds build verification), standard
    # (other commits incl. Merge/PR titles). 'minimal' (chore:) intentionally skips build.
    if: |
      needs.detect-changes.outputs.test-category == 'linting-build' ||
      needs.detect-changes.outputs.test-category == 'full' ||
      needs.detect-changes.outputs.test-category == 'affected' ||
      needs.detect-changes.outputs.test-category == 'standard'
    steps:
      - name: Harden the runner (Block egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org
            api.github.com
            github.com
            objects.githubusercontent.com
            nodejs.org
            raw.githubusercontent.com
            pypi.org
            files.pythonhosted.org

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html
