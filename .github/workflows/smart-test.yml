name: Test Suite

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      commit-type: ${{ steps.analyze-commit.outputs.type }}
      js-changed: ${{ steps.filter.outputs.js }}
      python-changed: ${{ steps.filter.outputs.python }}
      templates-changed: ${{ steps.filter.outputs.templates }}
      site-changed: ${{ steps.filter.outputs.site }}
      data-changed: ${{ steps.filter.outputs.data }}
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com
            github.com
            objects.githubusercontent.com
            raw.githubusercontent.com

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            js:
              - 'sitegen/static/js/**'
              - 'sitegen/static/css/**'
              - 'tests/js/**'
              - 'eslint.config.js'
              - 'stylelint.config.js'
              - 'package.json'
              - 'package-lock.json'
            python:
              - 'sitegen/**/*.py'
              - 'scripts/**/*.py'
              - 'tests/**/*.py'
              - 'requirements*.txt'
              - 'pyproject.toml'
            templates:
              - 'sitegen/templates/**'
              - '.djlintrc'
            site:
              - 'sitegen/**'
              - 'public/**'
              - 'tests/e2e/**'
              - 'tests/test_sitegen*.py'
              - 'requirements*.txt'
              - 'package.json'
              - 'package-lock.json'
              - 'pyproject.toml'
              - 'wrangler.jsonc'
            data:
              - 'public/data/**'

      - name: Analyze commit message
        id: analyze-commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -n "$PR_TITLE" ]; then
            commit_msg="$PR_TITLE"
          else
            commit_msg=$(git log -1 --pretty=%B HEAD)
          fi

          if [ -z "$commit_msg" ]; then
            echo "type=other" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_type="other"
          case "$commit_msg" in
            "Update challenge:"*) commit_type="daily" ;;
            "Update dependency"*) commit_type="dependency" ;;
            "chore(deps):"*) commit_type="dependency" ;;
            "fix:"*) commit_type="fix" ;;
            "feat:"*) commit_type="feature" ;;
            "chore:"*) commit_type="chore" ;;
          esac
          echo "type=$commit_type" >> "$GITHUB_OUTPUT"
          echo "Commit type: $commit_type"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.js-changed == 'true' || needs.detect-changes.outputs.python-changed == 'true' || needs.detect-changes.outputs.templates-changed == 'true'
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org
            api.github.com
            github.com
            objects.githubusercontent.com
            nodejs.org
            raw.githubusercontent.com
            pypi.org
            files.pythonhosted.org

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: needs.detect-changes.outputs.js-changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Node tooling
        if: needs.detect-changes.outputs.js-changed == 'true'
        run: npm ci

      - name: Run JavaScript and CSS lint
        if: needs.detect-changes.outputs.js-changed == 'true'
        run: npm run lint

      - name: Setup Python
        if: needs.detect-changes.outputs.python-changed == 'true' || needs.detect-changes.outputs.templates-changed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Python linting tools
        if: needs.detect-changes.outputs.python-changed == 'true' || needs.detect-changes.outputs.templates-changed == 'true'
        run: |
          pip install pylint==4.1.4 djlint==1.54.0 -r scripts/requirements.txt
          pip install Jinja2==3.1.6 MarkupSafe==3.0.4

      - name: Run Pylint
        if: needs.detect-changes.outputs.python-changed == 'true'
        run: pylint scripts/*.py sitegen/*.py --errors-only

      - name: Run djlint
        if: needs.detect-changes.outputs.templates-changed == 'true'
        run: djlint sitegen/templates --check --lint

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.python-changed == 'true' || needs.detect-changes.outputs.site-changed == 'true' || needs.detect-changes.outputs.data-changed == 'true'
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com
            github.com
            objects.githubusercontent.com
            pypi.org
            files.pythonhosted.org
            raw.githubusercontent.com

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Python unit and integration tests
        run: python -m pytest tests/ -m "not e2e and not live" -v

  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.js-changed == 'true'
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org
            api.github.com
            github.com
            objects.githubusercontent.com
            nodejs.org
            raw.githubusercontent.com

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Node tooling
        run: npm ci

      - name: Run Node unit tests
        run: npm run test:js

  build:
    name: Build static site
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.site-changed == 'true' || needs.detect-changes.outputs.data-changed == 'true' || needs.detect-changes.outputs.commit-type == 'feature' || needs.detect-changes.outputs.commit-type == 'fix' || needs.detect-changes.outputs.commit-type == 'dependency' || needs.detect-changes.outputs.commit-type == 'other'
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com
            github.com
            objects.githubusercontent.com
            pypi.org
            files.pythonhosted.org
            raw.githubusercontent.com

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Build (deployment command)
        run: bash scripts/build-site.sh

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/data/manifest.json
          test -d dist/assets
          grep -q '/assets/' dist/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("dist/data/manifest.json").read_text())
          assert manifest["schemaVersion"] == 1
          assert "birds.json" in manifest["files"]
          assert "daily.json" in manifest["files"]
          print("Build manifest verified:", len(manifest["files"]), "files")
          PY

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.site-changed == 'true' || needs.detect-changes.outputs.js-changed == 'true' || needs.detect-changes.outputs.templates-changed == 'true' || needs.detect-changes.outputs.commit-type == 'feature' || needs.detect-changes.outputs.commit-type == 'fix' || needs.detect-changes.outputs.commit-type == 'daily'
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com
            github.com
            objects.githubusercontent.com
            pypi.org
            files.pythonhosted.org
            raw.githubusercontent.com
            cdn.playwright.dev
            playwright.azureedge.net
            playwright.download.prss.microsoft.com
            storage.googleapis.com

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run browser tests
        run: python -m pytest tests/e2e -m "not live" -v --no-cov

  dependency-checks:
    name: Dependency checks
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.commit-type == 'dependency'
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org
            api.github.com
            github.com
            objects.githubusercontent.com
            nodejs.org
            raw.githubusercontent.com
            pypi.org
            files.pythonhosted.org

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Verify npm dependencies and tooling
        run: |
          npm ci
          npm run lint
          npm run test:js

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Verify Python dependencies and site build
        run: |
          pip install -r scripts/requirements.txt -r requirements-site.txt
          pip check
          python -m sitegen build

  game-logic:
    name: Daily game logic
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.commit-type == 'daily'
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org
            api.github.com
            github.com
            objects.githubusercontent.com
            nodejs.org
            raw.githubusercontent.com
            pypi.org
            files.pythonhosted.org

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Run daily generation and data manifest tests
        run: |
          pip install pytest python-dotenv Jinja2
          pytest tests/test_generate_daily_birds.py tests/test_sitegen_build.py -v --no-cov

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Run browser game logic unit tests
        run: |
          npm ci
          npm run test:js
