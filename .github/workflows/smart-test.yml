name: Smart Test Suite

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      commit-type: ${{ steps.analyze-commit.outputs.type }}
      js-changed: ${{ steps.changed-files.outputs.js_any_changed }}
      python-changed: ${{ steps.changed-files.outputs.python_any_changed }}
      test-category: ${{ steps.analyze-commit.outputs.test-category }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            src/**/*.{js,jsx}
            scripts/**/*.py
            package.json
            package-lock.json
            scripts/requirements.txt
            **/*.{test,spec}.{js,jsx,py}
          files_separator: ' '

      - name: Analyze commit message
        id: analyze-commit
        run: |
          # Get the commit message safely using git
          # Using git log ensures we get the actual commit message from the repository
          # rather than relying on potentially untrusted GitHub context variables
          commit_msg=$(git log -1 --pretty=%B HEAD)

          # Validate that commit_msg is not empty
          if [ -z "$commit_msg" ]; then
            echo "type=other" >> $GITHUB_OUTPUT
            echo "test-category=standard" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Determine commit type using patterns
          # Using printf and case statement instead of echo/grep for safer handling
          commit_type="other"
          test_category="standard"

          case "$commit_msg" in
            "Update challenge:"*)
              commit_type="daily"
              test_category="game-logic"
              ;;
            "chore(deps):"*)
              commit_type="dependency"
              test_category="linting-build"
              ;;
            "fix:"*)
              commit_type="fix"
              test_category="affected"
              ;;
            "feat:"*)
              commit_type="feature"
              test_category="full"
              ;;
            "chore:"*)
              commit_type="chore"
              test_category="minimal"
              ;;
          esac

          echo "type=$commit_type" >> $GITHUB_OUTPUT
          echo "test-category=$test_category" >> $GITHUB_OUTPUT

          echo "Commit type: $commit_type"
          echo "Test category: $test_category"

  lint:
    name: Linting
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.js-changed == 'true' || needs.detect-changes.outputs.python-changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: needs.detect-changes.outputs.js-changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: needs.detect-changes.outputs.js-changed == 'true'
        run: npm ci

      - name: Run ESLint
        if: needs.detect-changes.outputs.js-changed == 'true'
        run: npm run lint

      - name: Setup Python
        if: needs.detect-changes.outputs.python-changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Python dependencies
        if: needs.detect-changes.outputs.python-changed == 'true'
        run: pip install pylint

      - name: Run Pylint
        if: needs.detect-changes.outputs.python-changed == 'true'
        run: pylint scripts/*.py --errors-only

  dependency-tests:
    name: Dependency Resolution
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.commit-type == 'dependency'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Verify npm dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v6

      - name: Verify Python dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip check

  js-unit-tests:
    name: JS Unit Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.js-changed == 'true'
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install -D vitest @vitest/ui @vitest/coverage-v8

      - name: Run unit tests (shard ${{ matrix.shard }})
        run: npx vitest run --config=vitest.config.js --shard=${{ matrix.shard }}/3

  python-unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.python-changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov python-dotenv requests

      - name: Run unit tests
        run: pytest tests/ -v --no-cov

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.commit-type == 'daily' ||
      needs.detect-changes.outputs.commit-type == 'fix' ||
      needs.detect-changes.outputs.commit-type == 'feature' ||
      needs.detect-changes.outputs.test-category == 'full'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install -D vitest @vitest/ui @vitest/coverage-v8 @testing-library/react @testing-library/jest-dom jsdom

      - name: Run integration tests
        run: npx vitest run --config=vitest.config.js tests/integration

  game-logic-tests:
    name: Game Logic Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.commit-type == 'daily'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install -D vitest @vitest/ui @vitest/coverage-v8

      - name: Run GameLogic tests
        run: npx vitest run --config=vitest.config.js tests/unit/utils/GameLogic.test.jsx

      - name: Run DailyBirdUtils tests
        run: npx vitest run --config=vitest.config.js tests/unit/utils/DailyBirdUtils.test.jsx

      - name: Setup Python
        uses: actions/setup-python@v6

      - name: Run Python daily generation tests
        run: |
          pip install pytest python-dotenv
          pytest tests/test_generate_daily_birds.py -v --no-cov

  build-test:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.test-category == 'linting-build' ||
      needs.detect-changes.outputs.test-category == 'full' ||
      needs.detect-changes.outputs.test-category == 'standard'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html
