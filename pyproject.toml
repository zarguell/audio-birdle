[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-birdle"
version = "1.0.0"
description = "Python/Jinja static site generator for the Audio-Birdle game"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.4",
]

[tool.setuptools]
packages = ["sitegen"]
include-package-data = true

[tool.setuptools.package-data]
sitegen = [
    "templates/**/*.html",
    "static/**/*",
    "vendor/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-report=json:coverage.json",
    "--cov-fail-under=70",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: Browser end-to-end tests that build and serve the site",
    "live: Integration tests against the deployed live site",
    "slow: Slow running tests",
    "network: Tests that require network access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
# Coverage gates the production data pipeline scripts and the Python static
# site generator. One-off ebird-* developer tools and
# verify_hash_consistency.py have no dedicated tests and stay out of the gate.
source = ["scripts", "sitegen"]
omit = [
    "*/ebird-*.py",
    "*/verify_hash_consistency.py",
    "sitegen/__main__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
