[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-report=json:coverage.json",
    "--cov-fail-under=70",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "network: Tests that require network access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
# Only the production pipeline scripts (generate-daily-birds.py,
# generate-daily-region-data.py, game-data-generator.py — plus the shared
# ebird_api_common.py helper they import) are covered by the test suite and
# gated by --cov-fail-under. The ebird-* dev/data-fetch scripts and
# verify_hash_consistency.py are one-off developer tools with no tests of
# their own; including them would drag the gate below the threshold without
# adding protection, so they stay out of the gate.
source = ["scripts"]
omit = [
    "*/ebird-*.py",
    "*/verify_hash_consistency.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
