{% macro icon(name, class_name="icon") -%}
  <svg class="{{ class_name }}"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true"
       focusable="false">
    {%- if name == "home" -%}
      <path d="M3 11l9-8 9 8" />
      <path d="M5 10v10h14V10" />
    {%- elif name == "play" -%}
      <circle cx="12" cy="12" r="9" />
      <path d="M10 8l6 4-6 4z" />
    {%- elif name == "pause" -%}
      <circle cx="12" cy="12" r="9" />
      <path d="M10 8v8" />
      <path d="M14 8v8" />
    {%- elif name == "audio" -%}
      <path d="M9 18V5l10-2v13" />
      <circle cx="6" cy="18" r="3" /><circle cx="16" cy="16" r="3" />
    {%- elif name == "archive" -%}
      <path d="M4 6h16v4H4z" />
      <path d="M5 10v9h14v-9" />
      <path d="M9 14h6" />
    {%- elif name == "stats" -%}
      <path d="M4 20V10" />
      <path d="M10 20V4" />
      <path d="M16 20v-7" />
      <path d="M22 20H2" />
    {%- elif name == "settings" -%}
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
      <circle cx="12" cy="12" r="3" />
    {%- elif name == "back" -%}
      <path d="M19 12H5" />
      <path d="M12 19l-7-7 7-7" />
    {%- elif name == "next" -%}
      <path d="M5 12h14" />
      <path d="M12 5l7 7-7 7" />
    {%- elif name == "chevron-left" -%}
      <path d="M15 18l-6-6 6-6" />
    {%- elif name == "chevron-right" -%}
      <path d="M9 18l6-6-6-6" />
    {%- elif name == "volume" -%}
      <path d="M11 5L6 9H2v6h4l5 4z" />
      <path d="M15.5 8.5a5 5 0 010 7" />
      <path d="M18.5 5.5a9 9 0 010 13" />
    {%- elif name == "refresh" -%}
      <path d="M20 11a8 8 0 10-2.3 5.7" />
      <path d="M20 4v7h-7" />
    {%- elif name == "share" -%}
      <circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" />
      <path d="M8.6 10.6l6.8-4.2" />
      <path d="M8.6 13.4l6.8 4.2" />
    {%- elif name == "target" -%}
      <circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="4" /><circle cx="12" cy="12" r="1" />
    {%- elif name == "flame" -%}
      <path d="M12 22c4 0 7-2.7 7-6.5 0-3-1.8-5.3-4-7.5-1-1-2-2.3-3-4-1 3-2 4.4-3.3 5.7C6.5 11.5 5 13.7 5 15.5 5 19.3 8 22 12 22z" />
      <path d="M12 22c1.8 0 3-1.3 3-3 0-1.8-1.3-3-3-5-1.7 2-3 3.2-3 5 0 1.7 1.2 3 3 3z" />
    {%- elif name == "gamepad" -%}
      <path d="M6 8h12a4 4 0 014 4v2a4 4 0 01-4 4l-2-2H8l-2 2a4 4 0 01-4-4v-2a4 4 0 014-4z" />
      <path d="M8 11v4" />
      <path d="M6 13h4" />
      <circle cx="17" cy="12" r="1" /><circle cx="19" cy="15" r="1" />
    {%- elif name == "search" -%}
      <circle cx="11" cy="11" r="7" />
      <path d="M21 21l-4-4" />
    {%- elif name == "x" -%}
      <path d="M18 6L6 18" />
      <path d="M6 6l12 12" />
    {%- elif name == "check" -%}
      <path d="M20 6L9 17l-5-5" />
    {%- elif name == "map-pin" -%}
      <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1116 0z" />
      <circle cx="12" cy="10" r="2.5" />
    {%- elif name == "external" -%}
      <path d="M14 3h7v7" />
      <path d="M10 14L21 3" />
      <path d="M21 14v5a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h5" />
    {%- elif name == "info" -%}
      <circle cx="12" cy="12" r="9" />
      <path d="M12 11v5" />
      <path d="M12 8h.01" />
    {%- elif name == "trash" -%}
      <path d="M3 6h18" />
      <path d="M8 6V4h8v2" />
      <path d="M19 6l-1 14H6L5 6" />
      <path d="M10 11v5" />
      <path d="M14 11v5" />
    {%- elif name == "calendar" -%}
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M16 3v4" />
      <path d="M8 3v4" />
      <path d="M3 11h18" />
    {%- endif -%}
  </svg>
{%- endmacro %}
{% macro nav_item(href, label, name, active, page) -%}
  <a class="tabbar__link{% if page in active %}
              is-active{% endif %}"
     href="{{ href }}"{% if page in active %}
       aria-current="page"{% endif %}>
    {{ icon(name, "tabbar__icon") }}
    <span>{{ label }}</span>
  </a>
{%- endmacro %}
{% macro back_link(href, label="Back") -%}
  <a class="back-link"
     href="{{ href }}">{{ icon('back', 'back-link__icon') }}<span>{{ label }}</span></a>
{%- endmacro %}
